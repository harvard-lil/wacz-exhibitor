# Publishes the player as static sites on Cloudflare Pages: html/embed at the
# root, beside html/replay-web-page, matching the paths nginx.conf serves.
#
# Each deployment is a GitHub environment of the same name, holding:
#
#   PAGES_PROJECT                   Cloudflare Pages project to upload to.
#   PLAYER_ARCHIVE_ORIGINS          Space-separated origins the player may read
#                                   archives from. They become the connect-src
#                                   of the Content-Security-Policy written to
#                                   _headers, which reaches every hostname the
#                                   project serves. Without that header the
#                                   player would play any archive linked to it,
#                                   so the build fails if this is unset.
#   PLAYER_RELATIVE_SOURCE_ORIGINS  Optional JSON written to config.js as
#                                   relativeSourceOrigins, e.g.
#                                   [[".wacz", "https://my-waczs.s3.amazonaws.com"]].
#                                   Each origin must be in PLAYER_ARCHIVE_ORIGINS.
#
# The Pages projects, custom domains and DNS are managed in lil-terraform.
name: Publish player to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    # LIL's deployments; forks publish their own way if they want them.
    if: github.repository == 'harvard-lil/wacz-exhibitor'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        deployment:
          - wacz-exhibitor.lil.tools
          - rejouer.perma-stage.org
    concurrency:
      group: pages-${{ matrix.deployment }}
      cancel-in-progress: false
    environment:
      name: ${{ matrix.deployment }}
      url: https://${{ matrix.deployment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assemble site
        env:
          ARCHIVE_ORIGINS: ${{ vars.PLAYER_ARCHIVE_ORIGINS }}
          RELATIVE_SOURCE_ORIGINS: ${{ vars.PLAYER_RELATIVE_SOURCE_ORIGINS }}
        run: |
          set -euo pipefail
          : "${ARCHIVE_ORIGINS:?Set PLAYER_ARCHIVE_ORIGINS on the environment}"
          mkdir -p site
          cp -R html/embed/. site/
          cp -R html/replay-web-page site/replay-web-page
          rm -f site/replay-web-page/.keep
          # Without a top-level 404.html, Pages answers unknown paths with
          # index.html, as for a single-page app. ReplayWeb's API requests that
          # arrive before its service worker is active must get a 404, as they
          # do from NGINX, not an HTML page it tries to parse.
          echo "Not found" > site/404.html
          {
            echo "/*"
            echo "  Content-Security-Policy: default-src 'self' data: 'unsafe-inline' 'unsafe-hashes' 'unsafe-eval'; connect-src 'self' data: ${ARCHIVE_ORIGINS}"
          } > site/_headers
          cat site/_headers

          if [ -n "${RELATIVE_SOURCE_ORIGINS}" ]; then
            # Every mapped origin has to be readable under the CSP, or relative
            # sources would fail to load.
            for origin in $(jq -r '.[][1]' <<<"${RELATIVE_SOURCE_ORIGINS}"); do
              case " ${ARCHIVE_ORIGINS} " in
                *" ${origin} "*) ;;
                *) echo "::error::${origin} is not in PLAYER_ARCHIVE_ORIGINS"; exit 1 ;;
              esac
            done
            ORIGINS_JSON="$(jq -c . <<<"${RELATIVE_SOURCE_ORIGINS}")" \
              perl -pi -e 's/^export const relativeSourceOrigins = \[\];$/export const relativeSourceOrigins = $ENV{ORIGINS_JSON};/' site/config.js
            grep -q '^export const relativeSourceOrigins = \[\[' site/config.js
          fi
          grep '^export const relativeSourceOrigins' site/config.js

      - name: Deploy to Cloudflare Pages
        uses: harvard-lil/lil-actions/cloudflare-pages-deploy@main
        with:
          project-name: ${{ vars.PAGES_PROJECT }}
          directory: site
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
