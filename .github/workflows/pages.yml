# Publishes the project's own deployment of the player, wacz-exhibitor.lil.tools
# (used by museum.lil.tools and warcembed-demo.lil.tools), to Cloudflare Pages
# whenever main changes. Other sites deploy the player themselves from a
# release, with scripts/build-static.sh; Perma's Rejouer does this from Perma's
# staging and prod workflows.
#
# The GitHub environment wacz-exhibitor.lil.tools holds PAGES_PROJECT and
# PLAYER_ARCHIVE_ORIGINS (see scripts/build-static.sh). The Pages project, its
# custom domain and DNS are in lil-terraform/wacz-exhibitor/static.
name: Publish player to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # LIL's deployment; forks publish their own way if they want one.
    if: github.repository == 'harvard-lil/wacz-exhibitor'
    runs-on: ubuntu-latest
    environment:
      name: wacz-exhibitor.lil.tools
      url: https://wacz-exhibitor.lil.tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build site
        env:
          ARCHIVE_ORIGINS: ${{ vars.PLAYER_ARCHIVE_ORIGINS }}
        run: scripts/build-static.sh site

      - name: Deploy to Cloudflare Pages
        uses: harvard-lil/lil-actions/cloudflare-pages-deploy@main
        with:
          project-name: ${{ vars.PAGES_PROJECT }}
          directory: site
          branch: main
          skip-unchanged: "true"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
